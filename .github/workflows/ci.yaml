name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Docker Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.57.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # docker-container driver builder: required for the type=gha layer cache
      # the justfile enables under GITHUB_ACTIONS=true, so unchanged
      # Dockerfile.test / crypto-hook layers are reused across runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The runner injects the Actions cache-service credentials only into JS
      # actions, not bash steps (actions/runner#3046). Re-export them so the
      # plain `just verify` CLI builds can authenticate the type=gha layer
      # cache; without this, buildx silently skips the cache backend.
      - name: Expose Actions cache env to steps
        uses: actions/github-script@v7
        env:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            for (const name of [
              'ACTIONS_CACHE_URL',
              'ACTIONS_RUNTIME_TOKEN',
              'ACTIONS_RESULTS_URL',
              'ACTIONS_CACHE_SERVICE_V2',
            ]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      - name: Pull development image
        run: just pull-image

      - name: Verify
        run: just verify
